<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="auth">

    <h1>Create Account 🚀</h1>

    <form method="POST">

        <input
        type="text"
        name="username"
        placeholder="Username"
        required
        >

        <input
        type="password"
        name="password"
        placeholder="Password"
        required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have account?
        <a href="/login">
            Login
        </a>
    </p>

</div>

</body>
</html>
